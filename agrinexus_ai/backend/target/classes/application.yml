spring:
  application:
    name: agrinexus-backend

  datasource:
    url: jdbc:h2:mem:agrinexus_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update    # first run: use 'create', then switch to 'update'
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: agrinexus-super-secret-jwt-key-bits-narsampet-2024-agri-ai-platform
    expiration-ms: 86400000       # 24 h
    refresh-expiration-ms: 604800000  # 7 days
  ai-service:
    base-url: http://localhost:8000   # Python FastAPI AI service
  upload:
    dir: ./uploads/
    allowed-types: image/jpeg,image/png,image/webp
    max-size-bytes: 5242880           # 5 MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tags-sorter: alpha

logging:
  level:
    com.agrinexus: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
