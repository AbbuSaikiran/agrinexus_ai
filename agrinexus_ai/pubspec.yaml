name: agrinexus_ai
description: AgriNexus AI - Smart Farm Marketplace

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0

  # State Management
  provider: ^6.1.2

  # HTTP & Networking
  http: ^1.2.0

  # Local Storage
  shared_preferences: ^2.3.0

  # Image Handling
  image_picker: ^1.1.0
  cached_network_image: ^3.4.0

  # UI Extras
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  badges: ^3.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
